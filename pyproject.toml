[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "extend-nano-vllm"
version = "0.3.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "An extended nano-vLLM runtime for Qwen3 inference experiments"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn>=2.7.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "xxhash>=3.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[project.urls]
Homepage = "https://github.com/GeeeekExplorer/extend-nano-vllm"
Repository = "https://github.com/GeeeekExplorer/extend-nano-vllm"
Issues = "https://github.com/GeeeekExplorer/extend-nano-vllm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: CPU-only unit test",
    "single_gpu: requires one CUDA-capable GPU",
    "multi_gpu: requires multiple CUDA-capable GPUs",
    "slow: long-running integration test",
]
timeout = 180
